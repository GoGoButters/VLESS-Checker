services:
  vpn-checker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpn-checker
    ports:
      # Host port is server-specific: override it in .env (gitignored), e.g.
      #   PANEL_PORT=8010
      # so this file never has to be edited locally (and never conflicts on pull).
      - "${PANEL_PORT:-8001}:8000"
    volumes:
      - vpn_data:/app/data
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Memory ceiling is server-specific too: set PANEL_MEM in .env (e.g. 512m).
    mem_limit: ${PANEL_MEM:-512m}
    # Bound container logs: an unbounded json-file log grew to ~10GB on the
    # worker host and filled the disk (docker defaults to unlimited).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vpn_data:

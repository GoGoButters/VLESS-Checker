services:
  vpn-checker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpn-checker
    ports:
      - "8001:8000"
    volumes:
      - vpn_data:/app/data
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Bound container logs: an unbounded json-file log grew to ~10GB on the
    # worker host and filled the disk (docker defaults to unlimited).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vpn_data:

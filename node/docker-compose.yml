services:
  vpn-checker-node:
    build:
      context: ..
      dockerfile: node/Dockerfile
    image: vpn_checker_node:latest
    container_name: checker-node-all
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - MASTER_URL=http://192.168.1.107:8010/
      - NODE_TOKEN=ab2fdef999e90b9ac77ea7b9b2503b94
      - NODE_NAME=lanta
      - NODE_REGION=ru
      # «Висящий» туннель не должен съедать таймауты всех тестовых URL.
      - PROXY_TIME_BUDGET_S=25
    # Remove network mode if master running remotely
    network_mode: host
